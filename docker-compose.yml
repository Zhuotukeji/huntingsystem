services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /app/data/hunting.db
      DEMO_MODE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
    volumes:
      - hunting-data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_PATH: /app/data/hunting.db
      DEMO_MODE: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
    volumes:
      - hunting-data:/app/data
    restart: unless-stopped

volumes:
  hunting-data:
