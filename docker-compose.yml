services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /app/data/hunting.db
      DEMO_MODE: "true"
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-}
      SUB2API_API_KEY: ${SUB2API_API_KEY:-}
      SUB2API_MODEL: ${SUB2API_MODEL:-gpt-5.6}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-local-docker-key-change-in-production}
      PLUGIN_ACCESS_CODE: ${PLUGIN_ACCESS_CODE:-}
    volumes:
      - hunting-data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_PATH: /app/data/hunting.db
      DEMO_MODE: "true"
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-}
      SUB2API_API_KEY: ${SUB2API_API_KEY:-}
      SUB2API_MODEL: ${SUB2API_MODEL:-gpt-5.6}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-local-docker-key-change-in-production}
      PLUGIN_ACCESS_CODE: ${PLUGIN_ACCESS_CODE:-}
    volumes:
      - hunting-data:/app/data
    restart: unless-stopped

volumes:
  hunting-data:
