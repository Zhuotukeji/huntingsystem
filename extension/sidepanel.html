<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>觅才寻访助手</title><link rel="stylesheet" href="sidepanel.css"></head>
<body>
  <header><div class="mark">觅</div><div><strong>觅才寻访助手</strong><span>BOSS 人工搜索工作台</span></div><button id="logout" class="icon" title="退出内部登录" aria-label="退出">↪</button></header>
  <main>
    <section id="login-view">
      <h1>连接内部系统</h1>
      <p>使用管理员在“数据源与设置”中配置的插件访问码。</p>
      <label>后台地址<input id="backend" value="http://localhost:3000"></label>
      <label>工作邮箱<input id="email" type="email" placeholder="hr@company.com"></label>
      <label>插件访问码<input id="access-code" type="password" autocomplete="current-password"></label>
      <button id="login" class="primary">登录</button>
    </section>
    <section id="tasks-view" hidden>
      <div class="section-head"><div><h1>今日搜索任务</h1><p id="task-count">正在载入</p></div><button id="refresh" class="icon" title="刷新任务" aria-label="刷新">↻</button></div>
      <div id="tasks"></div>
      <div id="analysis" hidden><div class="section-head"><div><h2>当前截图判断</h2><p>仅分析当前可见卡片，不返回姓名</p></div><button id="close-analysis" class="icon" aria-label="关闭">×</button></div><div id="analysis-content"></div></div>
    </section>
    <p id="message" role="status"></p>
  </main>
  <footer>不自动浏览、不读取 Cookie、不自动发送消息</footer>
  <script src="sidepanel.js"></script>
</body>
</html>
